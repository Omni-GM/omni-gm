<!doctype html>
<!-- PROTOTYPE — throwaway. MCP Apps view (text/html;profile=mcp-app) for debrief_show.
     Three variants of the draft debrief, switchable with the floating bar or ← →:
     A Scene timeline · B Transcript margin · C Ledger -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Draft debrief</title>
<style>
  :root {
    --bg: var(--color-background-primary, #faf8f5);
    --panel: var(--color-background-secondary, #ffffff);
    --text: var(--color-text-primary, #1d1b18);
    --muted: var(--color-text-secondary, #6b655c);
    --line: var(--color-border-primary, #e6e1d8);
    --accent: #b4532a;
    --new: #2f7d4f;
    --set: #2c5d8f;
    --rel: #7a4b9a;
    --unrel: #9a4b4b;
    font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; padding-bottom: 72px; }
  header { padding: 20px 24px 12px; border-bottom: 1px solid var(--line); }
  header .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  header h1 { margin: 4px 0 6px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); max-width: 70ch; }
  .counts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
  .op { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; color: #fff; white-space: nowrap; }
  .op.create_entity { background: var(--new); } .op.set_property { background: var(--set); }
  .op.relate { background: var(--rel); } .op.unrelate { background: var(--unrel); }
  .quote { font-family: ui-serif, Georgia, serif; font-style: italic; color: var(--muted); }
  .line { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); }
  .why { color: var(--muted); font-size: 13px; }
  .before { text-decoration: line-through; color: var(--unrel); }
  .after { color: var(--new); font-weight: 600; }
  .kind { font-size: 11px; color: var(--muted); }
  button.drop { border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 11px; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  button.drop:hover { color: var(--unrel); border-color: var(--unrel); }
  .empty { color: var(--muted); font-style: italic; }

  /* A — Scene timeline */
  .timeline { padding: 16px 24px; }
  .scene { position: relative; padding-left: 28px; margin-bottom: 22px; }
  .scene::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: -22px; width: 2px; background: var(--line); }
  .scene:last-child::before { display: none; }
  .scene .dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 10px; display: grid; place-items: center; font-weight: 700; }
  .scene h2 { font-size: 15px; margin: 0; } .scene > p { margin: 2px 0 10px; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 4px; }
  .card .head { display: flex; gap: 8px; align-items: center; } .card .head strong { flex: 1; }

  /* B — Transcript margin */
  .margin { padding: 8px 24px; }
  .margin section { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .margin h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 12px; padding: 6px 0; align-items: start; }
  .row .quote { font-size: 15px; color: var(--text); }
  .note { border-left: 3px solid var(--line); padding-left: 10px; display: grid; gap: 2px; }
  .note.create_entity { border-color: var(--new); } .note.set_property { border-color: var(--set); }
  .note.relate { border-color: var(--rel); } .note.unrelate { border-color: var(--unrel); }

  /* C — Ledger */
  .ledger { padding: 12px 24px; }
  .note-box { background: var(--panel); border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
  .note-box b { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--bg); }
  tr.scene-head td { background: var(--bg); font-weight: 600; color: var(--accent); }

  /* prototype switcher (not part of the design) */
  #switcher { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; border-radius: 999px; padding: 6px 8px; display: flex; gap: 6px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.3); font: 12px ui-monospace, monospace; z-index: 10; }
  #switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 26px; height: 26px; cursor: pointer; }
  #switcher span { padding: 0 8px; }
</style>
</head>
<body>
<div id="app"><p class="empty" style="padding:24px">Waiting for the draft debrief…</p></div>
<div id="switcher"><button id="prev">←</button><span id="label"></span><button id="next">→</button></div>
<script>
const VARIANTS = [
  { key: "A", name: "Scene timeline", render: renderTimeline },
  { key: "B", name: "Transcript margin", render: renderMargin },
  { key: "C", name: "Ledger", render: renderLedger },
];
let variant = new URLSearchParams(location.search).get("variant") || "A";
let draft = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const val = (x) => (x === undefined || x === null ? "—" : typeof x === "object" ? JSON.stringify(x) : String(x));
const opLabel = { create_entity: "new", set_property: "change", relate: "link", unrelate: "unlink" };

function headline(c) {
  switch (c.op) {
    case "create_entity": return `<strong>${esc(c.subject)}</strong> <span class="kind">${esc(c.kind)}</span>`;
    case "set_property": return `<strong>${esc(c.subject)}</strong> · ${esc(c.key)}`;
    default: return `<strong>${esc(c.subject)}</strong> <span class="kind">${esc(c.type.replaceAll("_", " "))}</span> <strong>${esc(c.object)}</strong>`;
  }
}
function detail(c) {
  if (c.op === "create_entity")
    return Object.entries(c.properties || {}).map(([k, v]) => `<div><span class="kind">${esc(k)}</span> ${esc(val(v))}</div>`).join("");
  if (c.op === "set_property")
    return `<div>${c.before === undefined ? "" : `<span class="before">${esc(val(c.before))}</span> → `}<span class="after">${esc(val(c.after))}</span></div>`;
  return "";
}
const opBadge = (c) => `<span class="op ${c.op}">${opLabel[c.op]}</span>`;
const dropBtn = (c) => (draft.status === "draft" ? `<button class="drop" data-drop="${esc(c.changeId)}">drop</button>` : "");
const counts = () => {
  const all = draft.scenes.flatMap((s) => s.changes);
  const n = (op) => all.filter((c) => c.op === op).length;
  return `<div class="counts"><span class="pill">${n("create_entity")} new</span><span class="pill">${n("set_property")} changed</span><span class="pill">${n("relate") + n("unrelate")} links</span><span class="pill">${draft.scenes.length} scenes</span><span class="pill">${esc(draft.status)}</span></div>`;
};
const header = () => `<header><div class="eyebrow">Draft debrief · played ${esc(draft.playedOn)}</div><h1>${esc(draft.title)}</h1><p>${esc(draft.summary)}</p>${counts()}</header>`;

function renderTimeline() {
  return header() + `<div class="timeline">${draft.scenes.map((s) => `
    <div class="scene"><div class="dot">${s.ordinal}</div><h2>${esc(s.title)}</h2><p>${esc(s.summary)}</p>
      ${s.changes.length ? s.changes.map((c) => `
        <div class="card"><div class="head">${opBadge(c)}<span style="flex:1">${headline(c)}</span>${dropBtn(c)}</div>
          ${detail(c)}
          <div><span class="line">L${c.transcript.line}</span> <span class="quote">“${esc(c.transcript.quote)}”</span></div>
          <div class="why">Why: ${esc(c.why)}</div></div>`).join("") : `<p class="empty">No changes in this scene.</p>`}
    </div>`).join("")}</div>`;
}

function renderMargin() {
  return header() + `<div class="margin">${draft.scenes.map((s) => `
    <section><h2>Scene ${s.ordinal} · ${esc(s.title)}</h2>
      ${s.changes.length ? [...s.changes].sort((a, b) => a.transcript.line - b.transcript.line).map((c) => `
        <div class="row"><span class="line">L${c.transcript.line}</span>
          <span class="quote">“${esc(c.transcript.quote)}”</span>
          <div class="note ${c.op}"><div>${opBadge(c)} ${headline(c)} ${dropBtn(c)}</div>${detail(c)}<div class="why">${esc(c.why)}</div></div>
        </div>`).join("") : `<p class="empty">Nothing changed. ${esc(s.summary)}</p>`}
    </section>`).join("")}</div>`;
}

function renderLedger() {
  return header() + `<div class="ledger">
    <div class="note-box"><b>For your session note</b><div>${esc(draft.shortSummary)}</div></div>
    <table><thead><tr><th></th><th>Entity</th><th>Change</th><th>Line</th><th>Why</th><th></th></tr></thead><tbody>
    ${draft.scenes.map((s) => `<tr class="scene-head"><td colspan="6">${s.ordinal}. ${esc(s.title)}</td></tr>` +
      s.changes.map((c) => `<tr><td>${opBadge(c)}</td><td>${headline(c)}</td><td>${detail(c) || "—"}</td>
        <td class="line" title="${esc(c.transcript.quote)}">L${c.transcript.line}</td><td class="why">${esc(c.why)}</td><td>${dropBtn(c)}</td></tr>`).join("")).join("")}
    </tbody></table></div>`;
}

function render() {
  const v = VARIANTS.find((x) => x.key === variant) || VARIANTS[0];
  document.getElementById("label").textContent = `${v.key} (${v.name})`;
  if (draft) document.getElementById("app").innerHTML = v.render();
  reportSize();
}
function cycle(step) {
  const i = VARIANTS.findIndex((x) => x.key === variant);
  variant = VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length].key;
  const url = new URL(location.href); url.searchParams.set("variant", variant);
  try { history.replaceState(null, "", url); } catch {}
  render();
}
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

// --- MCP Apps bridge: JSON-RPC over postMessage with the host ---
let nextId = 1; const pending = new Map();
function request(method, params) {
  const id = nextId++;
  parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
const notify = (method, params) => parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
function reportSize() { notify("ui/notifications/size-changed", { height: document.documentElement.scrollHeight }); }

addEventListener("message", (e) => {
  const msg = e.data; if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.id !== undefined && pending.has(msg.id)) {
    const p = pending.get(msg.id); pending.delete(msg.id);
    msg.error ? p.reject(msg.error) : p.resolve(msg.result); return;
  }
  if (msg.method === "ui/notifications/tool-result") { draft = msg.params.structuredContent; render(); }
});
document.addEventListener("click", async (e) => {
  const id = e.target.closest("[data-drop]")?.dataset.drop; if (!id) return;
  await request("tools/call", { name: "debrief_drop", arguments: { changeId: id } });
  const result = await request("tools/call", { name: "debrief_show", arguments: { debriefId: draft.debriefId } });
  draft = result.structuredContent; render();
});

(async () => {
  render();
  const init = await request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "omni-gm-draft-debrief", version: "0.0.0" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  });
  const vars = init?.hostContext?.styles?.variables || {};
  for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v);
  notify("ui/notifications/initialized", {});
})();
</script>
</body>
</html>
